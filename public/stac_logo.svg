<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" width="220" height="56">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500&amp;display=swap');</style>
  </defs>
  <style>
    .logo-text { fill: #1E1B4B; transition: fill 0.3s ease; }
    @media (prefers-color-scheme: dark) {
      .logo-text { fill: #FFFFFF; }
    }
  </style>
  <g>
    <rect x="0"  y="0"  width="56" height="56" rx="9" fill="#6366F1"/>
    <rect x="6"  y="6"  width="20" height="20" rx="3" fill="#4F46E5"/>
    <rect x="30" y="6"  width="20" height="20" rx="3" fill="#818CF8"/>
    <rect x="6"  y="30" width="20" height="20" rx="3" fill="#818CF8"/>
    <rect x="30" y="30" width="20" height="20" rx="3" fill="#4338CA"/>
  </g>
  <text x="72" y="28" class="logo-text" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="30" font-weight="500" dominant-baseline="middle" letter-spacing="-0.3">STAC</text>
</svg>
