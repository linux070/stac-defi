specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: StacDEX
    network: arc-testnet
    source:
      address: "0x3200000000000000000000000000000000000000"
      abi: StacDex
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - SwapTransaction
        - BridgeTransaction
        - GlobalStat
        - User
      abis:
        - name: StacDex
          file: ./abis/StacDex.json
      eventHandlers:
        - event: Swap(indexed address,uint256,uint256,address,address,uint256,uint256)
          handler: handleSwap
      file: ./src/mapping.ts

  - kind: ethereum
    name: CircleBridge
    network: arc-testnet
    source:
      address: "0xE737e5cEBEEBa77EFE34D4aa090756590b1CE275"
      abi: MessageTransmitter
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - SwapTransaction
        - BridgeTransaction
      abis:
        - name: MessageTransmitter
          file: ./abis/MessageTransmitter.json
      eventHandlers:
        - event: MessageReceived(address,uint32,uint64,bytes32,bytes)
          handler: handleBridgeIn
      file: ./src/mapping.ts

  - kind: ethereum
    name: CircleBridgeSepolia
    network: sepolia
    source:
      address: "0x7865fAFc2db2093669d92c0F33AeEF291086BEFD"
      abi: MessageTransmitter
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - SwapTransaction
        - BridgeTransaction
      abis:
        - name: MessageTransmitter
          file: ./abis/MessageTransmitter.json
      eventHandlers:
        - event: MessageReceived(address,uint32,uint64,bytes32,bytes)
          handler: handleBridgeIn
      file: ./src/mapping.ts

  - kind: ethereum
    name: CircleBridgeBaseSepolia
    network: base-sepolia
    source:
      address: "0x7865fAFc2db2093669d92c0F33AeEF291086BEFD"
      abi: MessageTransmitter
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - SwapTransaction
        - BridgeTransaction
      abis:
        - name: MessageTransmitter
          file: ./abis/MessageTransmitter.json
      eventHandlers:
        - event: MessageReceived(address,uint32,uint64,bytes32,bytes)
          handler: handleBridgeIn
      file: ./src/mapping.ts
