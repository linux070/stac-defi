  <!-- Apply theme immediately before React loads to prevent flash on mobile -->
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('theme');
        let isDark = false;
        if (saved) {
          isDark = saved === 'dark';
        } else {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        const root = document.documentElement;
        if (isDark) {
          root.classList.add('dark');
          root.style.backgroundColor = '#000000';
          root.style.setProperty('--theme-bg-page', '#000000');
          root.style.setProperty('--theme-text-primary', '#f8fafc');
        } else {
          root.classList.remove('dark');
          root.style.backgroundColor = '#ffffff';
          root.style.setProperty('--theme-bg-page', '#ffffff');
          root.style.setProperty('--theme-text-primary', '#0f172a');
        }
      } catch (e) {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
