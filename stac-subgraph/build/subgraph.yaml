specVersion: 0.0.5
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: StacDEX
    network: arc-testnet
    source:
      address: "0x00EBABdF8B2F811074DF4922f8601190Aa0bab4f"
      abi: StacDex
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transaction
        - GlobalStat
        - User
      abis:
        - name: StacDex
          file: StacDEX\abis\StacDex.json
      eventHandlers:
        - event: Swap(indexed address,uint256,uint256,address,address,uint256,uint256)
          handler: handleSwap
      file: StacDEX\StacDEX.wasm
  - kind: ethereum
    name: CircleBridge
    network: arc-testnet
    source:
      address: "0xE737e5cEBEEBa77EFE34D4aa090756590b1CE275"
      abi: MessageTransmitter
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transaction
      abis:
        - name: MessageTransmitter
          file: CircleBridge\abis\MessageTransmitter.json
      eventHandlers:
        - event: MessageReceived(address,uint32,uint64,bytes32,bytes)
          handler: handleBridgeIn
      file: StacDEX\StacDEX.wasm
